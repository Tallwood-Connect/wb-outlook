<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wunderbuild compose test</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root{--ink:#0f2438;--muted:#5a6b7a;--line:#d3dce4;--bg:#fff;--brand:#2b976f;--navy:#0f2438}
  @media (prefers-color-scheme:dark){:root{--ink:#e6edf3;--muted:#98a9b8;--line:#2a3f54;--bg:#0b1a28;--navy:#08141f}}
  *{box-sizing:border-box} body{margin:0;padding:14px;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  h1{font-size:16px;margin:-14px -14px 14px;padding:12px 14px;background:var(--navy);color:#fff;border-bottom:3px solid var(--brand)}
  button{width:100%;padding:9px;border:0;border-radius:4px;background:var(--brand);color:#fff;font:600 14px "Segoe UI",system-ui,sans-serif;cursor:pointer}
  button:disabled{opacity:.5} p{color:var(--muted);font-size:12px}
  textarea{width:100%;height:340px;margin-top:10px;padding:8px;font:12px/1.4 Consolas,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px}
</style>
</head>
<body>
<h1>Compose test <span style="font-size:12px;font-weight:400;color:#9fc9b8">v1.21</span></h1>
<p>Open a new email, add a recipient, a subject, some text and an attachment, then press the button. This only reads the draft; nothing is saved or sent.</p>
<button id="run">Run compose test</button>
<textarea id="out" readonly placeholder="Results appear here. Select all and copy them back to Claude."></textarea>
<script>
const out = document.getElementById("out");
const log = (s) => { out.value += s + "\n"; };
const call = (label, fn) => new Promise((resolve) => {
  try {
    fn((r) => {
      if (r.status === Office.AsyncResultStatus.Succeeded) { log(`PASS  ${label}`); resolve(r.value); }
      else { log(`FAIL  ${label}: ${r.error && r.error.message}`); resolve(undefined); }
    });
  } catch (e) { log(`FAIL  ${label}: ${e.message}`); resolve(undefined); }
});
Office.onReady(() => {
  document.getElementById("run").addEventListener("click", async () => {
    out.value = ""; const item = Office.context.mailbox.item;
    log(`Host: ${Office.context.diagnostics.hostName} ${Office.context.diagnostics.hostVersion} (${Office.context.diagnostics.platform})`);
    log(`Item: ${item.itemType}, subject is ${typeof item.subject}, internetMessageId = ${item.internetMessageId === undefined ? "not available" : item.internetMessageId}`);
    for (const v of ["1.8", "1.10", "1.12", "1.14"]) log(`Mailbox ${v}: ${Office.context.requirements.isSetSupported("Mailbox", v) ? "yes" : "NO"}`);
    log(`roamingSettings: ${Office.context.roamingSettings ? "yes" : "NO"}`);
    log(`getAsFileAsync exists: ${typeof item.getAsFileAsync === "function"}`);
    log("");
    const subject = await call("subject.getAsync", (cb) => item.subject.getAsync(cb)); if (subject !== undefined) log(`      subject = "${subject}"`);
    const from = await call("from.getAsync", (cb) => item.from.getAsync(cb)); if (from) log(`      from = ${from.emailAddress}`);
    const to = await call("to.getAsync", (cb) => item.to.getAsync(cb)); if (to) log(`      to = ${to.map((x) => x.emailAddress).join(", ")}`);
    const cc = await call("cc.getAsync", (cb) => item.cc.getAsync(cb)); if (cc) log(`      cc count = ${cc.length}`);
    const html = await call("body HTML", (cb) => item.body.getAsync(Office.CoercionType.Html, cb)); if (html !== undefined) log(`      html length = ${html.length}`);
    const text = await call("body text", (cb) => item.body.getAsync(Office.CoercionType.Text, cb)); if (text !== undefined) log(`      text length = ${text.length}`);
    const atts = await call("getAttachmentsAsync", (cb) => item.getAttachmentsAsync(cb));
    if (atts) {
      log(`      attachments = ${atts.length}`);
      for (const a of atts) {
        const c = await call(`getAttachmentContentAsync (${a.name})`, (cb) => item.getAttachmentContentAsync(a.id, cb));
        if (c) log(`      ${a.name}: format ${c.format}, content length ${String(c.content).length}, inline ${a.isInline}`);
      }
    }
    const eml = await call("getAsFileAsync (export draft as .eml)", (cb) => item.getAsFileAsync(cb)); if (eml) log(`      eml base64 length = ${eml.length}`);
    log("\nDone.");
  });
});
</script>
</body>
</html>
