name: Tests
on:
  push:
    branches: [main, beta, stable]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Helper files, version rule and conversation matching
        run: node tests/modules.test.js
      - name: Send-time prompt rules
        run: node tests/launchevent.test.js
